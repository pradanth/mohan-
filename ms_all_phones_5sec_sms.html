<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Welcome</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.3),
            transparent 25%
        ),

        linear-gradient(
            135deg,
            #6a11cb,
            #2575fc,
            #ff4b8b
        );

    overflow-x: hidden;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    width: 92%;

    max-width: 700px;

    text-align: center;

    padding: 25px;
}


/* =========================
   TITLE
========================= */

h1 {

    color: white;

    font-size:
        clamp(30px, 7vw, 55px);

    margin-bottom: 10px;

    text-shadow:
        0 4px 15px
        rgba(0,0,0,0.3);
}


.subtitle {

    color: white;

    font-size: 18px;

    margin-bottom: 30px;
}


/* =========================
   BUTTONS
========================= */

.buttons {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 25px;

    flex-wrap: wrap;
}


.option {

    text-align: center;
}


button {

    border: none;

    border-radius: 18px;

    padding: 18px 30px;

    min-width: 220px;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    background: white;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.3);

    transition: 0.25s;
}


button:hover {

    transform:
        translateY(-5px)
        scale(1.03);
}


.coming {

    color: #16a34a;
}


.notcoming {

    color: #dc2626;
}


/* =========================
   PHOTO RESULT
========================= */

#result {

    display: none;

    margin-top: 30px;

    padding: 18px;

    background: white;

    border-radius: 25px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.35);

    animation:
        popup 0.5s ease;
}


#result img {

    width: 100%;

    max-height: 65vh;

    object-fit: contain;

    border-radius: 18px;
}


/* =========================
   WELCOME
========================= */

.welcome {

    margin-top: 15px;

    font-size:
        clamp(25px, 6vw, 42px);

    font-weight: bold;

    color: #e91e63;
}


.message {

    margin-top: 8px;

    font-size: 18px;

    color: #444;
}


/* =========================
   NOT COMING RESULT
========================= */

#angry {

    display: none;

    margin-top: 30px;

    color: white;

    animation:
        popup 0.5s ease;
}


.angry-emoji {

    font-size:
        clamp(90px, 22vw, 170px);

    animation:
        shake 0.25s
        infinite alternate;
}


.why {

    font-size: 32px;

    font-weight: bold;

    margin-top: 10px;
}


.call-text {

    font-size: 18px;

    font-weight: bold;

    line-height: 1.5;

    margin-top: 8px;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes popup {

    from {

        opacity: 0;

        transform:
            scale(0.7);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


@keyframes shake {

    from {

        transform:
            rotate(-8deg)
            scale(1);
    }

    to {

        transform:
            rotate(8deg)
            scale(1.1);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .buttons {

        flex-direction: column;

        align-items: center;
    }


    .option {

        width: 100%;
    }


    button {

        width: 100%;

        max-width: 300px;
    }

}

</style>

</head>

    <!-- =====================

<script>

let visitorName = "";

function startAnswer() {
    const input = document.getElementById("nameInput");
    const name = input.value.trim();

    if (!name) {
        document.getElementById("nameError").style.display = "block";
        input.focus();
        return;
    }

    visitorName = name;
    document.getElementById("nameError").style.display = "none";
    document.getElementById("nameBox").style.display = "none";
    document.getElementById("answerButtons").style.display = "flex";

    document.querySelector(".subtitle").textContent =
        "Hi " + visitorName + "! Choose one option below ❤️";
}

function hideButtons() {
    document.querySelector(".buttons").style.display = "none";
}

function sendAnswerSMS(answer) {
    const body = "Response received 💖\nName: " + visitorName +
                 "\nAnswer: " + answer;

    const numbers = "8489165098,6380462507";
    const smsUrl = "sms:" + numbers + "?body=" + encodeURIComponent(body);

    const status = document.getElementById("smsStatus");
    status.style.display = "block";
    status.textContent =
        "SMS ready for 8489165098 and 6380462507. Tap Send in the SMS app.";

    // Opens the phone's SMS app with the message pre-filled.
    // The user must tap Send.
    setTimeout(() => { window.location.href = smsUrl; }, 6000);
}

function showComing() {
    if (!visitorName) return;

    hideButtons();

    document.getElementById("result").style.display = "block";
    document.getElementById("angry").style.display = "none";

    document.querySelector(".subtitle").textContent =
        visitorName + " chose: I am coming ❤️";

    sendAnswerSMS("I am coming ❤️");
}

function showNotComing() {
    if (!visitorName) return;

    hideButtons();

    document.getElementById("result").style.display = "none";
    document.getElementById("angry").style.display = "block";

    document.querySelector(".subtitle").textContent =
        visitorName + " chose: I am not coming";

    sendAnswerSMS("I am not coming");
}
